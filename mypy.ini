# mypy 配置 —— 分阶段引入静态类型检查。
#
# 为什么值得做：2026-08-19 的 `NameError: pathlib` 让 CLI 在**所有受支持的
# Python 版本**（3.10–3.13）上启动即崩溃，已发布的 4.3.0 也中招，CI 红了十天
# 没人发现（本地 venv 是 3.14，PEP 649 注解惰性求值，1352 个测试全绿）。
# mypy 对那段代码一行就能报出来：`Name "pathlib" is not defined [name-defined]`。
#
# 策略：先用最宽松的配置跑通并接进 CI，**只把能抓真 bug 的规则设成硬失败**，
# 其余留作警告，之后逐模块收紧。一次性开全会得到 4001 个错误——那样的门禁
# 只会被绕过，等于没有。
[mypy]
python_version = 3.10
ignore_missing_imports = True
# 未标注类型的函数体不检查——63% 的注解覆盖率下，全开会淹没真正的问题
check_untyped_defs = False
allow_untyped_defs = True
no_strict_optional = True
# 排除不需要检查的目录
exclude = (?x)(
      ^\.venv/
    | ^build/
    | ^dist/
    | ^npm/
    | ^dist-native/
  )

# ── mixin 命令模块：裸名由 aria_cli 在运行期注入 ──────────────────────────
#
# apps/cli/commands/*.py 里的 console / HAS_RICH / MODELS 等名字是**有意**不
# import 的：aria_cli 通过 _rebind_mixin_globals() 把这些方法的 __globals__
# 指向自己的命名空间，运行期才解析得到。静态检查不可能知道这一点，全仓库
# 4001 个错误里有 3177 个 name-defined 全部来自这里。
#
# ruff 已经用 per-file-ignores 对同一批文件豁免了 F821（同一个原因），
# 这里保持一致。真正的解法是把状态显式注入到每个调用点，那是单独的重构。
[mypy-apps.cli.commands.*]
disable_error_code = name-defined, attr-defined

[mypy-aria_code.apps.cli.commands.*]
disable_error_code = name-defined, attr-defined

[mypy-src.aria_code.apps.cli.commands.*]
disable_error_code = name-defined, attr-defined

[mypy-apps.cli.providers.llm.ollama_stream]
disable_error_code = name-defined, no-redef

[mypy-aria_code.apps.cli.providers.llm.ollama_stream]
disable_error_code = name-defined, no-redef

[mypy-src.aria_code.apps.cli.providers.llm.ollama_stream]
disable_error_code = name-defined, no-redef

[mypy-apps.cli.football_reports]
disable_error_code = name-defined

[mypy-aria_code.apps.cli.football_reports]
disable_error_code = name-defined

[mypy-src.aria_code.apps.cli.football_reports]
disable_error_code = name-defined

[mypy-apps.cli.broker_render]
disable_error_code = name-defined

[mypy-aria_code.apps.cli.broker_render]
disable_error_code = name-defined

[mypy-src.aria_code.apps.cli.broker_render]
disable_error_code = name-defined

# aria_cli.py 是 7706 行的单体，正在逐步拆分；先不纳入门禁，避免噪音淹没
# 其它模块的真实问题。拆分推进后再收紧。
[mypy-aria_cli]
ignore_errors = True

# options_pricing 把 pandas 作为可选依赖：类型注解写成字符串 "pd.DataFrame"
# （不求值），import 放在函数体内懒加载。源码里已有 `# noqa: F821` 标注这是
# 有意为之。mypy 看不出字符串注解里的名字是懒加载的，会误报 name-defined。
[mypy-packages.quant_engine.stochastic.options_pricing]
disable_error_code = name-defined

# 可选依赖的 try/except 回退是标准写法，mypy 会把两个分支的同名绑定报成
# no-redef。这不是缺陷——改代码去迎合检查器反而会让回退逻辑更绕。
#   ollama_stream:      CORE_FILE_TOOLS 导入失败时退化为空 frozenset
#   local_finance_tools: ddgs 与 duckduckgo_search 两个包名的兼容
[mypy-tools.local_finance_tools]
disable_error_code = no-redef
