version: '3.9'
services:
  aria-local:
    build:
      context: .
      dockerfile: Dockerfile
    image: aria-code:local
    restart: unless-stopped
    volumes:
    - ${HOME}/.aria:/root/.aria
    - ${HOME}/.ollama:/root/.ollama
    environment:
    - ARIA_RELAY_URL=${ARIA_RELAY_URL:-wss://relay.aria.ai}
    - ARIA_RELAY_CLIENT_ID=${ARIA_RELAY_CLIENT_ID}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - FEISHU_APP_ID=${FEISHU_APP_ID:-}
    - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
    - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - aria-net
    command: python3 aria_daemon.py
  aria-relay-client:
    image: aria-code:local
    restart: unless-stopped
    volumes:
    - ${HOME}/.aria:/root/.aria
    environment:
    - ARIA_RELAY_URL=${ARIA_RELAY_URL:-wss://relay.aria.ai}
    - ARIA_RELAY_CLIENT_ID=${ARIA_RELAY_CLIENT_ID}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    - FEISHU_APP_ID=${FEISHU_APP_ID:-}
    - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
    - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
    - aria-local
    - ollama
    networks:
    - aria-net
    command: python3 aria_relay_client.py
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
    - ollama-models:/root/.ollama
    networks:
    - aria-net
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/api/tags
      interval: 20s
      timeout: 5s
      retries: 5
volumes:
  ollama-models: null
networks:
  aria-net:
    driver: bridge
