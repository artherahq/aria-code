name: CI

on:
  push:
    branches:
      - main
      - develop
      - dev
      - "agent/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
      - "release/**"
      - "codex/**"
    paths-ignore:        # docs-only changes don't need the full install + test matrix
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # run all Python versions to completion — don't cancel siblings on first failure
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout

      - name: Run tests (unit — no LLM required)
        env:
          # 关掉行情宇宙的联网抓取。fetch_market_universe() 会打 akshare
          # (stock_info_a_code_name / stock_hk_spot_em)，无超时，在 CI 上会挂到
          # pytest-timeout 的 60 秒上限——而受影响的用例测的是纯本地的自然语言
          # 路由逻辑，答案来自静态映射表，本就不需要网络。
          # 只影响 CI；不设这个变量时默认仍然联网，用户与线上服务行为不变。
          ARIA_OFFLINE: "1"
        run: |
          pytest tests/ -v -k "not e2e and not provider_integration" \
            --tb=short --timeout=60

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint (errors and undefined names only)
        run: ruff check . --select E9,F821,F823 --statistics

      - name: Ruff style warnings (non-blocking)
        run: ruff check . || true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the complete reachable history as well as the checked-out tree.
          fetch-depth: 0

      - name: Scan repository and history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
