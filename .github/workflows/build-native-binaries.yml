name: Build Native Binaries

# Builds a standalone PyInstaller binary per OS — the same architecture
# scripts/build_native_binary.sh uses locally on macOS (which also signs +
# notarizes when the real Developer ID cert is available; CI has no cert
# imported, so the macOS leg here produces an unsigned build and says so
# explicitly rather than claiming Gatekeeper-readiness it hasn't earned).
# Windows/Linux need no signing step — there's no notarization-equivalent
# gate blocking a plain .exe/ELF binary from running.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  BIN_NAME: aria-code-bin
  MCP_BIN_NAME: aria-code-mcp-bin

jobs:
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-14
    env:
      # Graceful skip if these secrets aren't configured — see below. Add
      # them (repo Settings → Secrets) once you have a Developer ID cert to
      # get signed+notarized release binaries; until then this job still
      # produces a working (but Gatekeeper-blocked) unsigned binary rather
      # than failing the whole workflow.
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Import Developer ID certificate into a temporary keychain
        if: env.HAS_MACOS_CERT == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f "$CERT_PATH"

      - name: Write App Store Connect API key to disk
        if: env.HAS_MACOS_CERT == 'true' && env.HAS_APPLE_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo -n "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Build (+ notarize if API-key secrets are set) via scripts/build_native_binary.sh
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ "$HAS_MACOS_CERT" == "true" && "$HAS_APPLE_NOTARY" == "true" ]]; then
            bash scripts/build_native_binary.sh --notarize
          else
            bash scripts/build_native_binary.sh
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-macos-arm64
          path: dist-native/dist/${{ env.BIN_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-mcp-macos-arm64
          path: dist-native/dist/${{ env.MCP_BIN_NAME }}

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + PyInstaller
        run: |
          python -m pip install --quiet -e . pyinstaller
      - name: Run PyInstaller (--onefile)
        run: >
          pyinstaller --onefile --name ${{ env.BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --collect-all rich --collect-all prompt_toolkit
          aria_cli.py
      - name: Smoke test
        run: dist-native\dist\${{ env.BIN_NAME }}.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-windows-x64
          path: dist-native/dist/${{ env.BIN_NAME }}.exe
      - name: Run PyInstaller for the MCP server binary (--onefile)
        run: >
          pyinstaller --onefile --name ${{ env.MCP_BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --copy-metadata aria-code
          aria_mcp_server.py
      - name: Smoke test (MCP server binary)
        run: dist-native\dist\${{ env.MCP_BIN_NAME }}.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-mcp-windows-x64
          path: dist-native/dist/${{ env.MCP_BIN_NAME }}.exe

  build-linux:
    name: Build (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + PyInstaller
        run: |
          python -m pip install --quiet -e . pyinstaller
      - name: Run PyInstaller (--onefile)
        run: >
          pyinstaller --onefile --name ${{ env.BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --collect-all rich --collect-all prompt_toolkit
          aria_cli.py
      - name: Smoke test
        run: dist-native/dist/${{ env.BIN_NAME }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-linux-x64
          path: dist-native/dist/${{ env.BIN_NAME }}
      - name: Run PyInstaller for the MCP server binary (--onefile)
        run: >
          pyinstaller --onefile --name ${{ env.MCP_BIN_NAME }}
          --distpath dist-native/dist --workpath dist-native/build --specpath dist-native
          --copy-metadata aria-code
          aria_mcp_server.py
      - name: Smoke test (MCP server binary)
        run: dist-native/dist/${{ env.MCP_BIN_NAME }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: aria-code-mcp-linux-x64
          path: dist-native/dist/${{ env.MCP_BIN_NAME }}

  attach-to-release:
    name: Attach binaries to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename artifacts for release
        run: |
          mkdir -p release
          cp artifacts/aria-code-macos-arm64/${{ env.BIN_NAME }} release/aria-code-macos-arm64
          cp artifacts/aria-code-windows-x64/${{ env.BIN_NAME }}.exe release/aria-code-windows-x64.exe
          cp artifacts/aria-code-linux-x64/${{ env.BIN_NAME }} release/aria-code-linux-x64
          cp artifacts/aria-code-mcp-macos-arm64/${{ env.MCP_BIN_NAME }} release/aria-code-mcp-macos-arm64
          cp artifacts/aria-code-mcp-windows-x64/${{ env.MCP_BIN_NAME }}.exe release/aria-code-mcp-windows-x64.exe
          cp artifacts/aria-code-mcp-linux-x64/${{ env.MCP_BIN_NAME }} release/aria-code-mcp-linux-x64
          chmod +x release/aria-code-macos-arm64 release/aria-code-linux-x64 release/aria-code-mcp-macos-arm64 release/aria-code-mcp-linux-x64
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # publish.yml 的 create-release 正常会先跑完（它只建一个 release，而这里
          # 要先构建三个平台的二进制）。但两个 workflow 由同一个 tag 并行触发，
          # 没有跨 workflow 的依赖可声明——所以这里兜一道底，免得 upload 因为
          # release 还不存在而失败。两边都是幂等的。
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
          gh release upload "${{ github.ref_name }}" release/* --clobber --repo "${{ github.repository }}"
